services:
  - type: web
    name: shopnexa
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER
        value: "true"
      # Use the existing Render PostgreSQL service instead of /var/data.
      - key: DATABASE_URL
        fromDatabase:
          name: shopnexa-db
          property: connectionString
      - key: DATA_DIR
        value: "/tmp/shopnexa_data"
      - key: OWNER_PASSWORD
        sync: false
      - key: MANAGER_PASSWORD
        sync: false
      - key: EMPLOYEE_PASSWORD
        sync: false
      - key: CREDENTIAL_RESET_TOKEN
        generateValue: true
      - key: WORK_AI_OWNER_MODE
        value: "true"
      - key: WEB_SEARCH_TIMEOUT
        value: "15"
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WORK_AI_MODEL
        value: "gpt-5.6"
      - key: WORK_AI_IMAGE_MODEL
        value: "gpt-image-2"
      - key: WORK_AI_VIDEO_MODEL
        value: "sora-2"
